# goreleaser config for termbg.
# Cross-compiles the CLI for macOS + Linux and uploads archives to the
# GitHub Release that release-please already created for this tag
# (release.mode: append avoids goreleaser trying to create its own
# release/changelog).
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: termbg
    main: ./cmd/termbg
    binary: termbg
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: termbg
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

release:
  mode: append
  disable: false

changelog:
  disable: true
